name: mi_michi
description: App de gestión de gatos - Mi Michi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado global
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3+1

  # Almacenamiento seguro del JWT
  flutter_secure_storage: ^10.0.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Navegación
  go_router: ^14.2.7

  # Selección de imagen
  image_picker: ^1.1.2

  # Gráficos (evolución de peso)
  fl_chart: ^0.68.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Fechas en español
  intl: ^0.19.0

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Iconos
  cupertino_icons: ^1.0.8
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
