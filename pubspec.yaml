name: mi_michi
description: App de gestión de gatos - Mi Michi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado global
  flutter_riverpod: ^3.0.0

  # HTTP
  dio: ^5.4.3+1

  # Almacenamiento seguro del JWT
  flutter_secure_storage: ^10.0.0

  # Acceso a directorios del sistema de archivos
  path_provider: ^2.1.5

  # Google Sign-In
  google_sign_in: ^7.0.0

  # Navegación
  go_router: ^17.0.0

  # Selección de imagen
  image_picker: ^1.1.2

  # Gráficos (evolución de peso)
  fl_chart: ^1.1.1

  # PDF
  pdf: ^3.13.0
  printing: ^5.15.0

  # Fechas en español
  intl: ^0.20.2

  # Notificaciones locales
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.1

  # Iconos
  cupertino_icons: ^1.0.8
  screenshot: ^3.0.0
  share_plus: ^13.2.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  model_viewer_plus: ^1.10.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
